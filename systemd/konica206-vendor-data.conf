# Source for the licensed Konica Minolta 245igdi runtime data that the
# konica206-native encoder needs (Halftones/COPA.DEFAULT.600x600.hft,
# Profiles/sRGB.icm, Profiles/sGrayInv.icm).
#
# Accepted values:
#   - a directory containing KonicaMinolta/245igdi, 245igdi, or Halftones/
#     and Profiles/ directly
#   - a local archive: .tar, .tar.gz, .tgz, .tar.xz, .txz or .zip
#   - an http(s) URL to such an archive
#
# The default below is the copy a local build bakes into the image from
# vendor-data/ (see README.md). It restores /var/lib/konica206/vendor if that
# directory is ever wiped. Public builds have no baked copy, so a missing
# source is skipped rather than treated as a boot failure.
#
# Leave empty to skip, or point at your own licensed directory/archive/URL.
# The data is proprietary and is never committed to this repository.
KONICA_VENDOR_SOURCE=/usr/share/konica206/vendor-data
